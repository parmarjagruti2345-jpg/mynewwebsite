<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Pro Toolkit</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#6d28d9,#ec4899);
color:white;
text-align:center;
}

.header{
padding:15px;
font-size:22px;
font-weight:bold;
background:rgba(0,0,0,0.2);
}

.card{
background:white;
color:black;
max-width:500px;
margin:40px auto;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

button{
padding:8px 18px;
border:none;
border-radius:20px;
margin:8px;
background:linear-gradient(45deg,#6d28d9,#ec4899);
color:white;
cursor:pointer;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="header">🎓 Student Pro Toolkit</div>

<!-- USERNAME PAGE -->
<div class="card" id="usernamePage">
<h2>Enter Your Name</h2>
<input type="text" id="usernameInput" placeholder="Type your name">
<br>
<button onclick="enterApp()">Enter</button>
<p id="errorMsg" style="color:red;"></p>
</div>

<!-- DASHBOARD PAGE -->
<div class="card hidden" id="dashboard">
<h2 id="welcomeText"></h2>
<button onclick="logout()">Logout</button>
<br><br>

<h3>Select Tool</h3>
<button onclick="alert('Resize Tool Open')">📏 Resize</button>
<button onclick="alert('Background Tool Open')">🎨 Background Remove</button>

</div>

<script>

// Auto login if saved
window.onload = function(){
let savedName = localStorage.getItem("username");
if(savedName){
showDashboard(savedName);
}
}

function enterApp(){
let name = document.getElementById("usernameInput").value.trim();

if(name === ""){
document.getElementById("errorMsg").innerText="Please enter your name";
return;
}

localStorage.setItem("username",name);
showDashboard(name);
}

function showDashboard(name){
document.getElementById("usernamePage").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("welcomeText").innerText="Hello "+name+" 👋";
}

function logout(){
localStorage.removeItem("username");
location.reload();
}

</script>

</body>
</html>
