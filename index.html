<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeEase AI Toolkit</title>

<style>
:root{
  --bg:#fef6ff;
  --card:#ffffffcc;
  --primary:#c084fc;
  --secondary:#f9a8d4;
  --text:#333;
}

body.dark{
  --bg:#1e1e2f;
  --card:#2c2c3f;
  --primary:#8b5cf6;
  --secondary:#ec4899;
  --text:#fff;
}

body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:linear-gradient(135deg,var(--bg),#e0f2fe);
  color:var(--text);
  transition:0.3s;
}

.container{
  text-align:center;
  padding:40px;
}

.card{
  background:var(--card);
  backdrop-filter:blur(15px);
  border-radius:20px;
  padding:25px;
  margin:20px auto;
  width:90%;
  max-width:500px;
  box-shadow:0 8px 25px rgba(0,0,0,0.1);
  transition:0.3s;
}

button{
  background:linear-gradient(45deg,var(--primary),var(--secondary));
  border:none;
  padding:10px 20px;
  border-radius:25px;
  color:white;
  cursor:pointer;
  font-size:15px;
  margin:5px;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

input, textarea, select{
  width:90%;
  padding:10px;
  margin:10px 0;
  border-radius:15px;
  border:1px solid #ddd;
}

.tool{
  display:none;
}

.dashboard{
  display:none;
}

.toggle{
  position:fixed;
  top:10px;
  right:10px;
}

h1{
  color:var(--primary);
}

.small{
  font-size:14px;
  opacity:0.7;
}
</style>
</head>

<body>

<button class="toggle" onclick="toggleMode()">🌙</button>

<div class="container">

<!-- Welcome Page -->
<div id="welcome" class="card">
  <h1>Welcome to LifeEase AI 💖</h1>
  <p class="small">Your Cute Smart Productivity Partner</p>
  <input type="text" id="username" placeholder="Enter your beautiful name">
  <button onclick="enterApp()">Enter Dashboard ✨</button>
</div>

<!-- Dashboard -->
<div id="dashboard" class="dashboard">
  <h1 id="greet"></h1>

  <div class="card">
    <h3>Select Your Tool 🌸</h3>
    <button onclick="openTool('planner')">📚 Study Planner</button>
    <button onclick="openTool('expense')">💰 Expense Helper</button>
    <button onclick="openTool('stress')">🧠 Stress Relief</button>
    <button onclick="openTool('resume')">📝 Resume Builder</button>
    <button onclick="openTool('goal')">🎯 Goal Tracker</button>
  </div>
</div>

<!-- Study Planner -->
<div id="planner" class="tool card">
  <h2>📚 Smart Study Planner</h2>
  <input type="text" id="subject" placeholder="Enter Subject">
  <input type="date" id="examdate">
  <button onclick="generatePlan()">Generate Plan</button>
  <p id="planResult"></p>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- Expense Helper -->
<div id="expense" class="tool card">
  <h2>💰 Expense Helper</h2>
  <input type="number" id="income" placeholder="Monthly Income">
  <input type="number" id="expenseVal" placeholder="Monthly Expense">
  <button onclick="calculateExpense()">Check Savings</button>
  <p id="expenseResult"></p>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- Stress Relief -->
<div id="stress" class="tool card">
  <h2>🧠 Stress Relief</h2>
  <select id="mood">
    <option>Happy</option>
    <option>Sad</option>
    <option>Stressed</option>
    <option>Overthinking</option>
  </select>
  <button onclick="stressTips()">Get Tips</button>
  <p id="stressResult"></p>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- Resume Builder -->
<div id="resume" class="tool card">
  <h2>📝 Resume Builder</h2>
  <input type="text" id="resName" placeholder="Your Name">
  <input type="text" id="resSkill" placeholder="Your Skills">
  <button onclick="generateResume()">Generate Resume</button>
  <p id="resumeResult"></p>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- Goal Tracker -->
<div id="goal" class="tool card">
  <h2>🎯 Goal Tracker</h2>
  <input type="text" id="goalInput" placeholder="Enter Your Goal">
  <button onclick="saveGoal()">Save Goal</button>
  <p id="goalResult"></p>
  <button onclick="goBack()">⬅ Back</button>
</div>

</div>

<script>
function enterApp(){
  let name=document.getElementById("username").value;
  if(name===""){ alert("Please enter your name"); return; }
  localStorage.setItem("username",name);
  document.getElementById("welcome").style.display="none";
  document.getElementById("dashboard").style.display="block";
  document.getElementById("greet").innerText="Hello "+name+" 🌷";
}

function openTool(id){
  document.getElementById("dashboard").style.display="none";
  document.querySelectorAll(".tool").forEach(t=>t.style.display="none");
  document.getElementById(id).style.display="block";
}

function goBack(){
  document.querySelectorAll(".tool").forEach(t=>t.style.display="none");
  document.getElementById("dashboard").style.display="block";
}

function generatePlan(){
  let sub=document.getElementById("subject").value;
  let date=document.getElementById("examdate").value;
  document.getElementById("planResult").innerHTML=
  "✨ Study "+sub+" daily for 2 hours.<br>Revise weekly until "+date+".<br>Sunday = Mock Test 🌟";
}

function calculateExpense(){
  let inc=Number(document.getElementById("income").value);
  let exp=Number(document.getElementById("expenseVal").value);
  let save=inc-exp;
  document.getElementById("expenseResult").innerHTML=
  save>0? "🎉 You can save ₹"+save+" per month! Smart budgeting!" :
  "⚠ Try reducing expenses for better savings.";
}

function stressTips(){
  let mood=document.getElementById("mood").value;
  let msg={
    "Happy":"🌸 Keep spreading positivity & gratitude journaling.",
    "Sad":"💖 Talk to someone & take a short walk.",
    "Stressed":"🧘 Try deep breathing for 5 minutes.",
    "Overthinking":"📵 Digital detox for 30 mins."
  };
  document.getElementById("stressResult").innerText=msg[mood];
}

function generateResume(){
  let n=document.getElementById("resName").value;
  let s=document.getElementById("resSkill").value;
  document.getElementById("resumeResult").innerHTML=
  "<b>"+n+"</b><br>Skills: "+s+"<br>Creative | Dedicated | Smart Learner 🌟";
}

function saveGoal(){
  let g=document.getElementById("goalInput").value;
  localStorage.setItem("goal",g);
  document.getElementById("goalResult").innerHTML=
  "🎯 Goal Saved: "+g+"<br>Daily Reminder: Stay Consistent!";
}

function toggleMode(){
  document.body.classList.toggle("dark");
}

window.onload=function(){
  let saved=localStorage.getItem("username");
  if(saved){
    document.getElementById("welcome").style.display="none";
    document.getElementById("dashboard").style.display="block";
    document.getElementById("greet").innerText="Welcome Back "+saved+" 💕";
  }
}
</script>

</body>
</html>
