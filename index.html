<!DOCTYPE html>
<html>
<head>
<title>My Pro Website</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    text-align:center;
}

.navbar{
    background:rgba(0,0,0,0.4);
    padding:15px;
    font-size:20px;
}

.hero{
    padding:100px 20px;
}

button{
    padding:12px 25px;
    border:none;
    background:white;
    color:#764ba2;
    font-size:18px;
    border-radius:25px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:black;
    color:white;
}

.footer{
    background:rgba(0,0,0,0.4);
    padding:15px;
    position:fixed;
    bottom:0;
    width:100%;
}
</style>

</head>
<body>

<div class="navbar">
🚀 My Pro Website
</div>

<div class="hero">
<h1>Welcome to My Professional Website</h1>
<p>I created this using GitHub Pages</p>
<button onclick="showMessage()">Click Me</button>
</div>

<div class="footer">
© 2026 My Website | All Rights Reserved
</div>

<script>
function showMessage(){
    alert("Welcome to Pro Level Website 🔥");
}
</script>

</body>
</html>
